Description=Hover the EXP bar for EXP per hour (last 10 minutes), time to the next level and this session's EXP. Double-click the EXP bar to start a new session. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
