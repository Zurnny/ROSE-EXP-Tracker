[Mod]
Name=EXP Tracker
Version=1.8
Author=Zurnny
Group=
Description=Hover the EXP bar for EXP per hour (last 10 minutes), time to the next level and this session's EXP. Double-click the EXP bar to start a new session. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Weapon Refresh: the HUD weapon slot now takes its durability from the inventory's weapon slot (the game only updates its own HUD copy at login), checked every 2 seconds and when you hover it.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-EXP-Tracker/main/EXP%20Tracker/manifest.txt
