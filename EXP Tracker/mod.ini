Description=Hover the EXP bar for EXP per hour (last 10 minutes), time to the next level and this session's EXP. Double-click the EXP bar to start a new session. Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Add-ons window: wide enough for a whole row of chat colours; the default UI Add-ons button matches the game's menu buttons better.
